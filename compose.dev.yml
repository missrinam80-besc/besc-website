name: besc-website-dev
services:
  website:
    image: ${BESC_WEBSITE_IMAGE:?Set an exact reviewed image digest}
    env_file: .env.production
    expose: ["3000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks:
      edge:
        aliases: ["besc-website-staging"]
networks:
  edge:
    external: true
    name: ${BESC_EDGE_NETWORK:?Set the inspected existing edge network}
